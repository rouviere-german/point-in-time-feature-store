[project]
name = "point-in-time-feature-store"
version = "0.1.0"
description = "A small bitemporal feature store: oracle-checked point-in-time joins, online/offline parity checks and signed entity erasure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rouviere German" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core (every repo) ---
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    # --- ml kit ---
    "numpy>=2.0",
    "pandera[polars]>=0.24",
    # --- feature store ---
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "mlflow-skinny>=2.18",
    # zoneinfo on Windows needs the IANA database for "UTC" timestamps
    "tzdata>=2024.1",
]

[project.scripts]
point-in-time-feature-store = "point_in_time_feature_store.cli:main"
pitfs = "point_in_time_feature_store.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "fakeredis[lua]>=2.26",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# Baseline metadata consumed by scripts/check_baseline.py.
# kind: "template" (both kits), "agentic" or "ml".
[tool.portfolio]
kind = "ml"
package = "point_in_time_feature_store"

# pip-audit has no native config file; tasks.py and CI read this list.
# Every entry needs a justification and a review date.
[tool.portfolio.audit]
ignore_vulns = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "C4", "RUF", "PT", "PL", "TRY", "BLE", "DTZ", "T20",
]
ignore = [
    "PLR0913",  # explicit keyword-heavy constructors are fine
    "PLR2004",  # magic numbers in tests and thresholds
    "TRY003",   # messages in exception constructors are fine
    "PLR0917",  # keyword-heavy service constructors, as for PLR0913
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "PLC0415", "S603"]
"scripts/**" = ["T201"]
"bench/**" = ["T201", "S311"]
"tasks.py" = ["T201", "S603", "S607"]
"src/point_in_time_feature_store/cli.py" = ["T201", "PLC0415"]  # lazy imports keep commands fast
"src/point_in_time_feature_store/demo.py" = ["PLR0915"]  # a linear, narrated script
"src/point_in_time_feature_store/offline/synthetic.py" = ["PLR0915"]  # one vectorized generator

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "bench", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*", "sklearn", "sklearn.*", "fakeredis", "fakeredis.*", "mlflow", "mlflow.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated tests with no I/O beyond tmp_path",
    "integration: tests that wire several components (app, files, CLI) together",
    "redis: tests that need a real Redis server (APP_TEST_REDIS_URL); skipped otherwise",
]
filterwarnings = ["error::DeprecationWarning:point_in_time_feature_store.*"]

[tool.coverage.run]
source = ["point_in_time_feature_store"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
